[package]
name = "brainmatter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bm-core.workspace = true
bm-embed.workspace = true
bm-macos.workspace = true
bm-mcp.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde.workspace = true
# preserve_order: edited config files of other tools keep their key order.
serde_json = { workspace = true, features = ["preserve_order"] }
toml_edit = "0.23"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot = "0.13"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
