# Runs on every push to main and on pull requests.
#
# The core, the MCP server, the stdio bridge and the frontend are checked on
# Linux. The app and the macOS-only crates build only on macOS, so two macOS jobs
# check and build them too; GitHub's runners cost nothing for a public repo.
# On main, those two save the caches the release workflow starts from: a tag
# can read main's caches, but not those of an earlier tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SQLCipher needs OpenSSL on Linux
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy -p bm-core -p bm-mcp -p bm-cli --all-targets -- -D warnings
      - run: cargo test -p bm-core -p bm-mcp -p bm-cli

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  # The same lint and tests as the release, over the whole workspace.
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The release build without signing the update, so a tag finds its
  # dependencies compiled and a broken build shows before tagging.
  macos-build:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Build the stdio bridge
        run: |
          cargo build --release -p bm-cli
          mkdir -p app/src-tauri/binaries
          cp target/release/brainmatter-mcp "app/src-tauri/binaries/brainmatter-mcp-$TARGET"
      - name: Build the app
        working-directory: app
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: bun run tauri build --bundles app --config src-tauri/tauri.bundle.conf.json
