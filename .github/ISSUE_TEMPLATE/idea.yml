name: Idea
description: Something Brainmatter should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What gets in your way
      description: The situation and the problem, before any solution. What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it. Rough is fine.
  - type: textarea
    id: today
    attributes:
      label: How you work around it today
