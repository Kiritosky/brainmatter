[package]
name = "embed-bench"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
fastembed = { version = "7.5", default-features = false, features = ["onnx", "ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
anyhow.workspace = true
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }
tokenizers = "0.22"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
serde_json.workspace = true
