[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
bm-core = { path = "crates/bm-core" }
bm-mcp = { path = "crates/bm-mcp" }
bm-macos = { path = "crates/bm-macos" }
bm-embed = { path = "crates/bm-embed" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
