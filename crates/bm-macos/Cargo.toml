[package]
name = "bm-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSData", "NSArray", "NSString", "NSError", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "block2"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "LABiometryType", "block2"] }
security-framework = "3"
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
